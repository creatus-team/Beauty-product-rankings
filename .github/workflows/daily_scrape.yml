name: Daily Scrape

on:
  workflow_dispatch:            # 수동 실행 전용 (자동 스케줄 OFF — 비용 통제)

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run TikTok Viral US scraper
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python viral_us_daily.py

      - name: Refresh Vercel product data (Amazon/OY/YS/TT)
        run: |
          curl -s -X POST https://kbeautyresearch.vercel.app/api/refresh \
            -H "Content-Type: application/json" \
            --max-time 180 | python3 -c "import sys,json; d=json.load(sys.stdin); print('✅ Products:', d.get('count'), 'updated_at:', d.get('updated_at'))"

      - name: Download fresh amazon_cache.json from Vercel
        run: |
          curl -s "https://kbeautyresearch.vercel.app/api/data" --max-time 60 | \
            python3 -c 'import sys,json; d=json.load(sys.stdin); open("amazon_cache.json","w",encoding="utf-8").write(json.dumps(d,ensure_ascii=False,indent=2)); print("amazon_cache.json saved:",d.get("updated_at"))'

      - name: Commit all daily data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add viral_us_data_*.json viral_us_beauty_*.md amazon_cache.json rankings_*.json
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "auto: daily data update $(date +'%Y-%m-%d')"
          # 푸시 충돌 시 자동 rebase 후 재시도 (최대 3회)
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0 || sleep 5
          done
          exit 1

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          vercel --prod --token $VERCEL_TOKEN --yes
